packages:
  - 'sdk'
  - 'desktop'
  - 'goose-binary/*'

registry: https://registry.npmjs.org/
preferOffline: true
nodeLinker: hoisted
supportedArchitectures:
  os: [current, linux, darwin, win32]
  cpu: [current, x64, arm64]
overrides:
  react: ^19.2.8
  react-dom: ^19.2.8
  # Security floors added 2026-11 (Dependabot advisories). Range-scoped so
  # only matching versions are forced; remove entries when parents update.
  '@ai-sdk/provider-utils@<3.0.28': '>=3.0.28'
  '@babel/core@<=7.29.0': '>=7.29.6'
  '@hono/node-server@>=1.19.10 <2.1.6': '>=2.1.6'
  '@humanfs/node@<0.16.8': '>=0.16.8'
  '@modelcontextprotocol/sdk@<1.32.0': '>=1.32.0'
  '@vitest/mocker@>=2.1.0 <4.1.12': '>=4.1.12'
  '@xmldom/xmldom@<=0.9.11': '>=0.9.12'
  'body-parser@>=1.0.0 <1.20.9': '>=1.20.9 <2'
  'body-parser@>=2.0.0 <2.4.0': '>=2.4.0'
  'katex@<0.18.2': '>=0.18.2'
  'brace-expansion@<1.1.21': '>=1.1.21 <2'
  'brace-expansion@>=2.0.0 <2.1.7': '>=2.1.7 <3'
  'brace-expansion@>=4.0.0 <5.0.12': '>=5.0.12 <6'
  'fast-uri@<3.1.9': '>=3.1.9'
  'minimatch@>=7.0.0 <11.0.1': '>=11.0.1'
  'hono@<4.13.16': '>=4.13.16'
  'ip-address@>=10.0.0 <=10.7.4': '>=10.7.4'
  'js-yaml@>=3.0.0 <3.15.2': '>=3.15.2 <4'
  'js-yaml@>=4.0.0 <4.3.2': '>=4.3.2 <5'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'postcss-selector-parser@>=6.0.0 <6.1.5': '6.1.5'
  'postcss-selector-parser@>=7.0.0 <7.1.6': '7.1.6'
  'proxy-addr@<2.0.8': '>=2.0.8'
  'path-to-regexp@>=8.0.0 <8.4.0': '>=8.4.0'
  'qs@<6.16.1': '>=6.16.1'
  'smol-toml@<1.9.0': '>=1.9.0'
  'source-map-js@<1.2.2': '>=1.2.2'
  'tar@<7.5.21': '>=7.5.21'
  'tmp@<0.2.6': '>=0.2.6'
  # jsdom requires undici's 7.x internal layout (wrap-handler.js) - stay <8
  'undici@>=7.0.0 <7.30.1': '>=7.30.1 <8'
  'uuid@>=13.0.0 <13.0.1': '>=13.0.1'
  'vite@>=8.2.0 <=8.2.4': '>=8.2.4'
  'yaml@>=1.0.0 <1.10.3': '>=1.10.3 <2'
  'yaml@>=2.0.0 <2.8.3': '>=2.8.3 <3'
  'zod@<4.6.6': '>=4.6.6'
allowBuilds:
  '@modelcontextprotocol/ext-apps': true
  electron: true
  electron-winstaller: true
  esbuild: true
# Electron Forge resolves @electron/node-gyp from git.
blockExoticSubdeps: false
