name: BuildNotify

on:
  workflow_run:
    workflows:
      - CI
      - Release
      - Canary
    types: [completed]
    branches-ignore:
      - "release/**"


jobs:
  notify:
    if: >
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure' &&
      (
        github.event.workflow_run.name != 'CI' ||
        github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.event == 'merge_group'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_GOOSE_STATUS }}
        run: |
          # Forks do not configure the Discord webhook secret; curl exits 2
          # ("failed to initialize") on an empty URL, which turned this
          # notifier lane red (2026-11-14). Skip cleanly instead.
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_GOOSE_STATUS secret not set - skipping notification"
            exit 0
          fi
          curl -sS --fail-with-body -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Build Failed",
                "description": "**Workflow:** ${{ github.event.workflow_run.name }}\n**Branch:** ${{ github.event.workflow_run.head_branch }}\n**Commit:** ${{ github.event.workflow_run.head_sha }}",
                "url": "${{ github.event.workflow_run.html_url }}",
                "color": 15158332
              }]
            }' \
            "$DISCORD_WEBHOOK_URL"
