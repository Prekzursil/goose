name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'  # For pre-releases like v1.2.3-beta
    paths-ignore:
      - 'documentation/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write      # Required for Sigstore OIDC signing
  attestations: write  # Required for SLSA build provenance attestations

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            # Native ARM64 runner: the 2026-11-14 build failed because the
            # qemu emulator could not run the pctx_type_check_runtime build
            # script (exit 101 under /dev/.buildkit_qemu_emulator). Building
            # arm64 natively removes the emulation entirely.
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare platform variables
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/goose
          tags: |
            # For main branch: latest, main, and sha
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            # For tags: v1.2.3 -> 1.2.3, 1.2, 1, latest (if not pre-release)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # For pre-release tags: keep the full version
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push single-platform image
        id: docker-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # pin@v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/goose:${{ steps.meta.outputs.version }}-${{ env.PLATFORM_PAIR }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}
          platforms: ${{ matrix.platform }}

      - name: Attest single-platform image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/goose
          subject-digest: ${{ steps.docker-push.outputs.digest }}
          push-to-registry: true

  merge:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/goose
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge multi-arch manifest
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=("-t" "$tag")
          done <<EOF_TAGS
          ${{ steps.meta.outputs.tags }}
          EOF_TAGS
          docker buildx imagetools create \
            "${args[@]}" \
            "ghcr.io/${{ github.repository_owner }}/goose:${{ steps.meta.outputs.version }}-linux-amd64" \
            "ghcr.io/${{ github.repository_owner }}/goose:${{ steps.meta.outputs.version }}-linux-arm64"
